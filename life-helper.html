<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="CivicAI AI Life Helper with voice assistant"
>

<title>CivicAI — AI Life Helper</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

/* =========================================================
   CIVICAI LIFE HELPER
   COMPLETE SINGLE FILE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#050914;
    --bg2:#090f1d;

    --panel:#0d1526;
    --panel2:#111b2f;

    --border:rgba(255,255,255,.08);
    --border2:rgba(255,255,255,.14);

    --text:#f5f7ff;
    --text2:#aeb9ce;
    --muted:#6f7b91;

    --primary:#5b7cff;
    --primary2:#8b5cf6;

    --cyan:#39d9ff;
    --pink:#ff65b3;

    --green:#2dd4bf;
    --red:#ff5d73;

    --shadow:
        0 25px 80px rgba(0,0,0,.40);

    --radius:18px;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(91,124,255,.15),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(139,92,246,.12),
            transparent 30%
        ),
        var(--bg);

    overflow:hidden;
}

/* =========================================================
   APP
========================================================= */

.app{

    width:100%;
    height:100vh;

    display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:280px;
    height:100vh;

    flex-shrink:0;

    background:
        rgba(7,12,25,.92);

    border-right:
        1px solid var(--border);

    padding:18px;

    display:flex;
    flex-direction:column;

    backdrop-filter:blur(25px);

    position:relative;

    z-index:50;

    transition:.3s ease;
}

.logo{

    display:flex;
    align-items:center;

    gap:12px;

    padding:
        7px 8px 22px;
}

.logo-icon{

    width:43px;
    height:43px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 10px 30px
        rgba(91,124,255,.3);

    font-size:18px;
}

.logo-text{

    font-size:20px;
    font-weight:800;
}

.logo-text span{
    color:#8395ff;
}

/* =========================================================
   NEW CHAT
========================================================= */

.new-chat{

    width:100%;

    padding:13px 15px;

    border-radius:14px;

    border:
        1px solid var(--border2);

    background:
        linear-gradient(
            135deg,
            rgba(91,124,255,.18),
            rgba(139,92,246,.12)
        );

    color:white;

    display:flex;
    align-items:center;

    gap:10px;

    cursor:pointer;

    font-weight:700;

    transition:.25s;
}

.new-chat:hover{

    transform:translateY(-2px);

    border-color:
        rgba(124,92,255,.55);
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{

    position:relative;

    margin:18px 0;
}

.search-box i{

    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:13px;
}

.search-box input{

    width:100%;

    padding:
        11px 12px 11px 36px;

    border-radius:12px;

    border:
        1px solid var(--border);

    outline:none;

    background:
        rgba(255,255,255,.035);

    color:white;
}

.search-box input::placeholder{
    color:#667187;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar-title{

    color:var(--muted);

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1.2px;

    font-weight:800;

    margin:
        5px 5px 10px;
}

.recent-list{

    flex:1;

    min-height:0;

    overflow-y:auto;
}

.recent-item{

    display:flex;
    align-items:center;

    gap:10px;

    padding:11px 10px;

    border-radius:11px;

    color:var(--text2);

    cursor:pointer;

    font-size:12px;
}

.recent-item:hover{

    background:
        rgba(255,255,255,.05);

    color:white;
}

.recent-item i{

    width:15px;

    color:#7888ff;
}

.recent-item span{

    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.empty-recent{

    color:var(--muted);

    font-size:12px;

    line-height:1.6;

    padding:10px;
}

/* =========================================================
   SIDEBAR BOTTOM
========================================================= */

.sidebar-bottom{

    border-top:
        1px solid var(--border);

    margin-top:12px;

    padding-top:13px;
}

.sidebar-btn{

    width:100%;

    border:none;

    background:transparent;

    color:var(--text2);

    padding:11px 10px;

    border-radius:11px;

    display:flex;
    align-items:center;

    gap:11px;

    cursor:pointer;

    font-size:13px;

    text-align:left;
}

.sidebar-btn:hover{

    background:
        rgba(255,255,255,.05);

    color:white;
}

/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    min-width:0;

    height:100vh;

    display:flex;

    flex-direction:column;

    position:relative;
}

/* =========================================================
   HEADER
========================================================= */

.header{

    height:70px;

    flex-shrink:0;

    padding:
        0 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(5,9,20,.72);

    backdrop-filter:blur(22px);

    z-index:20;
}

.header-left{

    display:flex;
    align-items:center;

    gap:12px;
}

.mobile-menu{

    display:none;

    border:none;

    background:transparent;

    color:white;

    font-size:19px;

    cursor:pointer;
}

.header-title{

    font-size:15px;

    font-weight:800;
}

.status{

    display:flex;
    align-items:center;

    gap:7px;

    color:var(--text2);

    font-size:11px;

    margin-top:2px;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px
        rgba(45,212,191,.8);
}

.header-actions{

    display:flex;

    gap:7px;
}

.icon-btn{

    width:38px;
    height:38px;

    border-radius:11px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.035);

    color:var(--text2);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.icon-btn:hover{

    color:white;

    border-color:
        rgba(91,124,255,.55);
}

/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        28px 20px 190px;
}

.chat-container{

    width:min(900px,100%);

    margin:auto;
}

/* =========================================================
   AI ASSISTANT HERO
========================================================= */

.welcome{

    min-height:55vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 10px;
}

/* =========================================================
   BEAUTIFUL FEMALE AI AVATAR
========================================================= */

.ai-orb{

    width:125px;
    height:125px;

    position:relative;

    margin-bottom:25px;
}

.ai-orb::before{

    content:"";

    position:absolute;

    inset:-18px;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(91,124,255,.45),
            rgba(255,101,179,.35),
            transparent
        );

    filter:blur(7px);

    animation:
        orbRotate 7s linear infinite;
}

.ai-orb::after{

    content:"";

    position:absolute;

    inset:-7px;

    border-radius:50%;

    border:
        1px solid
        rgba(125,139,255,.35);

    box-shadow:
        0 0 40px
        rgba(91,124,255,.28);

    animation:
        orbPulse 2.8s ease-in-out infinite;
}

@keyframes orbRotate{

    to{
        transform:rotate(360deg);
    }
}

@keyframes orbPulse{

    0%,
    100%{
        transform:scale(.96);
        opacity:.55;
    }

    50%{
        transform:scale(1.04);
        opacity:1;
    }
}

/* =========================================================
   FEMALE DIGITAL AVATAR
========================================================= */

.ai-face{

    position:absolute;

    width:94px;
    height:108px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:
        48% 48% 44% 44%;

    background:
        linear-gradient(
            145deg,
            #ffd9d0,
            #eeb5b0 55%,
            #c98791
        );

    box-shadow:
        inset -8px -10px 20px
        rgba(90,35,55,.12),

        0 10px 30px
        rgba(0,0,0,.25);

    z-index:2;
}

/* hair */

.ai-hair{

    position:absolute;

    width:108px;
    height:112px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-55%);

    border-radius:
        52% 52% 40% 42%;

    background:
        linear-gradient(
            145deg,
            #241b32,
            #46304d 55%,
            #171323
        );

    z-index:3;

    pointer-events:none;

    clip-path:
        polygon(
            4% 42%,
            8% 18%,
            25% 4%,
            52% 0%,
            78% 8%,
            94% 28%,
            96% 100%,
            76% 91%,
            70% 52%,
            57% 29%,
            42% 40%,
            27% 26%,
            20% 100%,
            3% 100%
        );
}

/* eyes */

.ai-eye{

    position:absolute;

    width:9px;
    height:5px;

    top:48px;

    border-radius:50%;

    background:#38263e;

    z-index:5;
}

.ai-eye.left{
    left:23px;
}

.ai-eye.right{
    right:23px;
}

.ai-eye::after{

    content:"";

    position:absolute;

    width:3px;
    height:2px;

    right:1px;
    top:1px;

    border-radius:50%;

    background:white;
}

/* nose */

.ai-nose{

    position:absolute;

    width:7px;
    height:12px;

    left:50%;
    top:55px;

    transform:translateX(-50%);

    border-right:
        1px solid
        rgba(120,65,75,.25);

    z-index:5;
}

/* smile */

.ai-mouth{

    position:absolute;

    width:22px;
    height:9px;

    left:50%;
    top:74px;

    transform:translateX(-50%);

    border-bottom:
        2px solid
        #9b4d6c;

    border-radius:
        0 0 50% 50%;

    z-index:5;
}

/* glow */

.ai-glow{

    position:absolute;

    width:35px;
    height:35px;

    border-radius:50%;

    right:2px;
    top:5px;

    background:
        rgba(91,124,255,.7);

    filter:blur(16px);

    z-index:1;

    animation:
        glowMove 3s ease-in-out infinite;
}

@keyframes glowMove{

    0%,
    100%{
        transform:translate(0,0);
        opacity:.5;
    }

    50%{
        transform:translate(-12px,12px);
        opacity:.9;
    }
}

/* =========================================================
   VOICE ACTIVE AVATAR
========================================================= */

.voice-active .ai-orb::before{

    animation-duration:2s;
}

.voice-active .ai-orb::after{

    animation-duration:.9s;

    border-color:
        rgba(255,101,179,.75);
}

.voice-active .ai-face{

    box-shadow:
        0 0 35px
        rgba(255,101,179,.25),
        inset -8px -10px 20px
        rgba(90,35,55,.12);
}

/* =========================================================
   WELCOME TEXT
========================================================= */

.welcome h1{

    font-size:
        clamp(30px,5vw,48px);

    letter-spacing:-1.6px;

    margin-bottom:12px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a9b7ff,
            #f0a5d0
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.welcome p{

    max-width:650px;

    color:var(--text2);

    font-size:14px;

    line-height:1.7;
}

/* =========================================================
   VOICE STATUS
========================================================= */

.voice-status{

    margin-top:18px;

    padding:9px 14px;

    border-radius:999px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.035);

    color:var(--text2);

    font-size:11px;

    display:flex;
    align-items:center;

    gap:7px;
}

.voice-status.active{

    color:#ff9ccc;

    border-color:
        rgba(255,101,179,.35);

    background:
        rgba(255,101,179,.07);
}

/* =========================================================
   MESSAGES
========================================================= */

.message{

    display:flex;

    gap:12px;

    margin-bottom:24px;

    animation:
        messageIn .3s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{

    flex-direction:row-reverse;
}

.message-avatar{

    width:36px;
    height:36px;

    flex-shrink:0;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );
}

.message.user .message-avatar{

    background:
        linear-gradient(
            135deg,
            #27344e,
            #1b2539
        );
}

.message-body{

    max-width:min(75%,720px);
}

.message.user .message-body{
    text-align:right;
}

.message-bubble{

    padding:
        14px 17px;

    border-radius:17px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid var(--border);

    color:#e9edf5;

    line-height:1.7;

    font-size:14px;

    text-align:left;

    overflow-wrap:anywhere;
}

.message.user .message-bubble{

    background:
        linear-gradient(
            135deg,
            rgba(91,124,255,.20),
            rgba(139,92,246,.16)
        );

    border-color:
        rgba(91,124,255,.20);
}

.message-bubble pre{

    background:#050913;

    border:
        1px solid var(--border);

    padding:14px;

    border-radius:10px;

    overflow-x:auto;

    margin:10px 0;
}

.message-bubble code{

    font-family:
        Consolas,
        monospace;

    font-size:12px;
}

.message-meta{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:5px;

    color:#5e697d;

    font-size:10px;
}

.message.user .message-meta{
    justify-content:flex-end;
}

.message-actions{

    display:flex;
    gap:5px;
}

.message-actions button{

    border:none;

    background:transparent;

    color:#657188;

    cursor:pointer;
}

/* =========================================================
   TYPING
========================================================= */

.typing{

    display:none;

    align-items:center;

    gap:10px;

    margin-bottom:20px;
}

.typing.show{
    display:flex;
}

.typing-avatar{

    width:36px;
    height:36px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );
}

.typing-bubble{

    padding:13px 16px;

    border-radius:15px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.04);
}

.typing-dots{

    display:flex;

    gap:4px;
}

.typing-dots span{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#8490ff;

    animation:
        dot 1.2s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{

    0%,
    60%,
    100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =========================================================
   INPUT AREA
========================================================= */

.input-wrapper{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
        20px 20px 24px;

    background:
        linear-gradient(
            to top,
            var(--bg) 65%,
            transparent
        );

    z-index:30;
}

.input-container{

    width:min(900px,100%);

    margin:auto;

    border:
        1px solid var(--border2);

    background:
        rgba(13,20,36,.94);

    border-radius:20px;

    box-shadow:var(--shadow);

    backdrop-filter:blur(20px);

    transition:.25s;
}

.input-container:focus-within{

    border-color:
        rgba(91,124,255,.5);

    box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        0 0 0 3px
        rgba(91,124,255,.05);
}

.attachment-preview{

    display:none;

    align-items:center;

    gap:9px;

    margin:
        12px 14px 0;

    padding:
        9px 11px;

    border-radius:10px;

    background:
        rgba(91,124,255,.08);

    border:
        1px solid
        rgba(91,124,255,.16);

    font-size:12px;
}

.attachment-preview.show{
    display:flex;
}

.attachment-preview span{
    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.remove-attachment{

    border:none;

    background:transparent;

    color:#8792a6;

    cursor:pointer;
}

.input-row{

    display:flex;

    align-items:flex-end;

    gap:8px;

    padding:12px;
}

.input-actions{

    display:flex;

    gap:3px;
}

.tool-btn{

    width:38px;
    height:38px;

    flex-shrink:0;

    border:none;

    border-radius:11px;

    background:transparent;

    color:#7b879c;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.tool-btn:hover{

    background:
        rgba(255,255,255,.06);

    color:white;
}

.tool-btn.voice-active{

    color:#ff71b9;

    background:
        rgba(255,101,179,.10);

    box-shadow:
        0 0 18px
        rgba(255,101,179,.15);
}

/* =========================================================
   TEXT INPUT
========================================================= */

.chat-input{

    flex:1;

    min-width:0;

    width:100%;

    min-height:40px;

    max-height:130px;

    resize:none;

    overflow-y:auto;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    padding:
        9px 5px;

    font-size:14px;

    line-height:1.5;

    font-family:inherit;

    display:block;

    opacity:1;

    pointer-events:auto;

    user-select:text;
}

.chat-input:disabled,
.chat-input[readonly]{

    opacity:1;

    cursor:text;
}

.chat-input::placeholder{
    color:#69758a;
}

.send-btn{

    width:42px;
    height:42px;

    flex-shrink:0;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #5b7cff,
            #7c5cff
        );

    color:white;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.25s;
}

.send-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(91,124,255,.35);
}

.send-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;
}

.input-footer{

    text-align:center;

    color:#4f5a6d;

    font-size:10px;

    padding:
        0 15px 10px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;
    bottom:100px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#151e32;

    color:white;

    border:
        1px solid var(--border2);

    border-radius:12px;

    padding:
        11px 17px;

    font-size:12px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    transition:.3s;

    z-index:100;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   LIGHT MODE
========================================================= */

body.light-mode{

    --bg:#f5f7fb;
    --panel:#fff;

    --border:rgba(20,30,50,.09);
    --border2:rgba(20,30,50,.15);

    --text:#172033;
    --text2:#596579;
    --muted:#7d8797;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(91,124,255,.10),
            transparent 30%
        ),
        #f5f7fb;
}

body.light-mode .sidebar{

    background:
        rgba(255,255,255,.92);
}

body.light-mode .header{

    background:
        rgba(245,247,251,.85);
}

body.light-mode .input-container{

    background:
        rgba(255,255,255,.94);
}

<script>

"use strict";


document.addEventListener(
"DOMContentLoaded",
() => {


/* =========================================================
   ELEMENTS
========================================================= */

const sidebar =
    document.getElementById("sidebar");

const mobileMenu =
    document.getElementById("mobileMenu");

const chatMessages =
    document.getElementById("chatMessages");

const chatContainer =
    document.getElementById("chatContainer");

const chatInput =
    document.getElementById("chatInput");

const sendButton =
    document.getElementById("sendButton");

const fileButton =
    document.getElementById("fileButton");

const fileInput =
    document.getElementById("fileInput");

const cameraButton =
    document.getElementById("cameraButton");

const voiceButton =
    document.getElementById("voiceButton");

const typingIndicator =
    document.getElementById("typingIndicator");

const welcomeScreen =
    document.getElementById("welcomeScreen");

const newChatButton =
    document.getElementById("newChatButton");

const sidebarNewChat =
    document.getElementById("sidebarNewChat");

const clearHistoryButton =
    document.getElementById("clearHistoryButton");

const saveChatButton =
    document.getElementById("saveChatButton");

const exportChatButton =
    document.getElementById("exportChatButton");

const themeButton =
    document.getElementById("themeButton");

const attachmentPreview =
    document.getElementById("attachmentPreview");

const attachmentName =
    document.getElementById("attachmentName");

const attachmentIcon =
    document.getElementById("attachmentIcon");

const removeAttachment =
    document.getElementById("removeAttachment");

const recentSearchList =
    document.getElementById("recentSearchList");

const chatSearch =
    document.getElementById("chatSearch");

const helperToast =
    document.getElementById("helperToast");

const aiOrb =
    document.getElementById("aiOrb");

const voiceStatus =
    document.getElementById("voiceStatus");

const voiceStatusText =
    document.getElementById("voiceStatusText");


/* =========================================================
   API
========================================================= */

const CHAT_API_ENDPOINT =
    "/api/chat";

const ANALYZE_API_ENDPOINT =
    "/api/analyze";


/* =========================================================
   STATE
========================================================= */

let selectedFile = null;

let messages = [];

let recentSearches = [];

let savedChats = [];

let isSending = false;


/* =========================================================
   VOICE STATE
========================================================= */

let recognition = null;

let voiceListening = false;

let voiceAssistantEnabled = false;

let speechWasInterrupted = false;


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_MESSAGES =
    "civicai_messages";

const STORAGE_RECENT =
    "civicai_recent";

const STORAGE_SAVED =
    "civicai_saved";

const STORAGE_THEME =
    "civicai_theme";


/* =========================================================
   INIT
========================================================= */

loadStorage();

renderRecentSearches();

applySavedTheme();

autoResizeTextarea();

setupVoiceRecognition();

keepInputEnabled();


/* =========================================================
   ALWAYS KEEP TEXT INPUT ENABLED
========================================================= */

function keepInputEnabled(){

    if(!chatInput){
        return;
    }

    chatInput.disabled = false;

    chatInput.readOnly = false;

    chatInput.removeAttribute("disabled");

    chatInput.removeAttribute("readonly");

}


/* =========================================================
   STORAGE
========================================================= */

function loadStorage(){

    try{

        const savedMessages =
            localStorage.getItem(
                STORAGE_MESSAGES
            );

        const savedRecent =
            localStorage.getItem(
                STORAGE_RECENT
            );

        const saved =
            localStorage.getItem(
                STORAGE_SAVED
            );


        if(savedMessages){

            const parsed =
                JSON.parse(savedMessages);

            if(Array.isArray(parsed)){
                messages = parsed;
            }

        }


        if(savedRecent){

            const parsed =
                JSON.parse(savedRecent);

            if(Array.isArray(parsed)){
                recentSearches = parsed;
            }

        }


        if(saved){

            const parsed =
                JSON.parse(saved);

            if(Array.isArray(parsed)){
                savedChats = parsed;
            }

        }


        if(messages.length){
            restoreMessages();
        }

    }
    catch(error){

        console.error(
            "Storage error:",
            error
        );

        messages = [];

        recentSearches = [];

        savedChats = [];

    }

}


function saveMessages(){

    try{

        localStorage.setItem(
            STORAGE_MESSAGES,
            JSON.stringify(messages)
        );

    }
    catch(error){

        console.error(error);

    }

}


function saveRecentSearches(){

    try{

        localStorage.setItem(
            STORAGE_RECENT,
            JSON.stringify(recentSearches)
        );

    }
    catch(error){

        console.error(error);

    }

}


function saveSavedChats(){

    try{

        localStorage.setItem(
            STORAGE_SAVED,
            JSON.stringify(savedChats)
        );

    }
    catch(error){

        console.error(error);

    }

}


/* =========================================================
   WELCOME
========================================================= */

function hideWelcome(){

    if(welcomeScreen){
        welcomeScreen.style.display = "none";
    }

}


function showWelcome(){

    if(welcomeScreen){
        welcomeScreen.style.display = "flex";
    }

}


/* =========================================================
   RESTORE
========================================================= */

function restoreMessages(){

    hideWelcome();

    messages.forEach(message => {

        if(
            message &&
            (
                message.role === "user" ||
                message.role === "ai"
            ) &&
            typeof message.content === "string"
        ){

            renderMessage(
                message.role,
                message.content,
                false
            );

        }

    });

    scrollToBottom();

}


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

    if(!helperToast){
        return;
    }

    helperToast.textContent =
        String(text);

    helperToast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () => {

                helperToast.classList.remove(
                    "show"
                );

            },
            2800
        );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================================================
   FORMAT
========================================================= */

function formatMessage(text){

    if(!text){
        return "";
    }

    let html =
        escapeHTML(
            String(text)
        );


    html =
        html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );


    html =
        html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    html =
        html.replace(
            /^• (.*)$/gm,
            "<div>• $1</div>"
        );


    html =
        html.replace(
            /^- (.*)$/gm,
            "<div>• $1</div>"
        );


    html =
        html.replace(
            /^(\d+)\.\s+(.*)$/gm,
            "<div>$1. $2</div>"
        );


    html =
        html.replace(
            /\n/g,
            "<br>"
        );


    return html;

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(
    role,
    content,
    save = true
){

    hideWelcome();


    const message =
        document.createElement("div");

    message.className =
        `message ${role}`;


    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";


    avatar.innerHTML =
        role === "ai"
        ? '<i class="fa-solid fa-brain"></i>'
        : '<i class="fa-solid fa-user"></i>';


    const body =
        document.createElement("div");

    body.className =
        "message-body";


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    bubble.innerHTML =
        formatMessage(content);


    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";


    const time =
        document.createElement("span");

    time.textContent =
        getCurrentTime();


    const actions =
        document.createElement("div");

    actions.className =
        "message-actions";


    if(role === "ai"){

        const copy =
            document.createElement("button");

        copy.type = "button";

        copy.innerHTML =
            '<i class="fa-regular fa-copy"></i>';

        copy.title =
            "Copy response";

        copy.onclick =
            () => copyText(content);

        actions.appendChild(copy);

    }


    meta.appendChild(time);

    meta.appendChild(actions);

    body.appendChild(bubble);

    body.appendChild(meta);

    message.appendChild(avatar);

    message.appendChild(body);


    if(
        typingIndicator &&
        typingIndicator.parentNode === chatContainer
    ){

        chatContainer.insertBefore(
            message,
            typingIndicator
        );

    }
    else{

        chatContainer.appendChild(
            message
        );

    }


    if(save){

        messages.push({

            role:role,

            content:String(content),

            time:Date.now()

        });

        saveMessages();

    }


    scrollToBottom();

}


/* =========================================================
   TIME
========================================================= */

function getCurrentTime(){

    return new Date().toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

    requestAnimationFrame(
        () => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }
    );

}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

    if(!typingIndicator){
        return;
    }

    typingIndicator.classList.add(
        "show"
    );

    scrollToBottom();

}


function hideTyping(){

    if(!typingIndicator){
        return;
    }

    typingIndicator.classList.remove(
        "show"
    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(isSending){
        return;
    }


    keepInputEnabled();


    const text =
        String(
            chatInput.value || ""
        ).trim();


    const file =
        selectedFile;


    if(!text && !file){

        showToast(
            "Write a message or attach an image."
        );

        chatInput.focus();

        return;

    }


    isSending = true;

    sendButton.disabled = true;


    let userMessage =
        text;


    if(file){

        userMessage =
            text
            ? `${text}\n\n📎 Attached: ${file.name}`
            : `📎 Attached: ${file.name}`;

    }


    renderMessage(
        "user",
        userMessage
    );


    if(text){
        addRecentSearch(text);
    }


    chatInput.value = "";

    autoResizeTextarea();

    showTyping();


    try{

        const response =
            await getAIResponse(
                text,
                file
            );


        hideTyping();


        renderMessage(
            "ai",
            response
        );


        /*
         * IMPORTANT:
         * Speak AI answer when voice mode is ON.
         */

        if(voiceAssistantEnabled){

            speakAIResponse(
                response
            );

        }

    }
    catch(error){

        hideTyping();

        console.error(
            "CivicAI error:",
            error
        );


        const errorMessage =
            `**CivicAI couldn't process your request.**\n\n${error.message || "Unknown server error."}`;


        renderMessage(
            "ai",
            errorMessage
        );


        if(voiceAssistantEnabled){

            speakAIResponse(
                "Sorry, I could not process that request."
            );

        }

    }
    finally{

        isSending = false;

        sendButton.disabled = false;

        clearAttachment();

        resetFileInput();

        keepInputEnabled();

        chatInput.focus();

    }

}


/*
 * Make sendMessage available to browser/debugging
 */

window.sendMessage =
    sendMessage;


/* =========================================================
   AI RESPONSE
========================================================= */

async function getAIResponse(
    text,
    file
){

    const userText =
        String(text || "").trim();


    /* =====================================================
       IMAGE
    ===================================================== */

    if(
        file &&
        file.type &&
        file.type.startsWith("image/")
    ){

        const image =
            await fileToDataURL(file);


        const response =
            await fetch(
                ANALYZE_API_ENDPOINT,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        description:
                            userText ||
                            "Analyze this image naturally and explain what you understand. Answer like a normal AI assistant, not like a civic report.",

                        location:"",

                        reporterName:
                            "CivicAI User",

                        image:image

                    })

                }
            );


        return processServerResponse(
            response
        );

    }


    if(file){

        throw new Error(
            "Only image files are supported."
        );

    }


    if(!userText){

        throw new Error(
            "Please enter a message."
        );

    }


    /* =====================================================
       CONVERSATION
    ===================================================== */

    const conversation =
        messages
        .slice(-20)
        .map(
            item => {

                return {

                    role:
                        item.role === "ai"
                        ? "assistant"
                        : "user",

                    content:
                        String(
                            item.content || ""
                        )

                };

            }
        );


    const response =
        await fetch(
            CHAT_API_ENDPOINT,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body:JSON.stringify({

                    message:userText,

                    conversation:conversation

                })

            }
        );


    return processServerResponse(
        response
    );

}


/* =========================================================
   SERVER RESPONSE
========================================================= */

async function processServerResponse(
    response
){

    const raw =
        await response.text();


    if(!raw){

        throw new Error(
            `Backend returned an empty response. HTTP ${response.status}`
        );

    }


    let data;


    try{

        data =
            JSON.parse(raw);

    }
    catch(error){

        console.error(
            "Invalid backend response:",
            raw
        );


        if(
            raw.trim().startsWith("<")
        ){

            throw new Error(
                "Backend returned HTML instead of JSON. Make sure server.js is running and /api/chat exists."
            );

        }


        throw new Error(
            `Backend returned invalid JSON. HTTP ${response.status}`
        );

    }


    if(!response.ok){

        const serverError =
            data?.error ||
            data?.message ||
            data?.details ||
            data?.response ||
            data?.answer;


        if(response.status === 401){

            throw new Error(
                "AI API key is invalid or unauthorized."
            );

        }


        if(response.status === 403){

            throw new Error(
                serverError ||
                "AI request was forbidden."
            );

        }


        if(response.status === 404){

            throw new Error(
                serverError ||
                "The API endpoint was not found."
            );

        }


        if(response.status === 429){

            throw new Error(
                serverError ||
                "AI rate limit reached. Please try again."
            );

        }


        throw new Error(
            serverError ||
            `AI server error: HTTP ${response.status}`
        );

    }


    const answer =
        extractAIResponse(data);


    if(!answer){

        throw new Error(
            "Backend responded but did not return an AI answer."
        );

    }


    return answer.trim();

}


/* =========================================================
   EXTRACT RESPONSE
========================================================= */

function extractAIResponse(data){

    if(typeof data === "string"){
        return data;
    }


    if(
        !data ||
        typeof data !== "object"
    ){
        return "";
    }


    const fields = [

        "answer",
        "response",
        "reply",
        "message",
        "text",
        "content",
        "analysis"

    ];


    for(const key of fields){

        if(
            typeof data[key] === "string" &&
            data[key].trim()
        ){

            return data[key].trim();

        }

    }


    for(
        const key of
        ["response","answer","analysis"]
    ){

        if(
            data[key] &&
            typeof data[key] === "object"
        ){

            const nested =
                extractAIResponse(
                    data[key]
                );

            if(nested){
                return nested;
            }

        }

    }


    return "";

}


/* =========================================================
   FILE
========================================================= */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    if(
                        typeof reader.result !==
                        "string"
                    ){

                        reject(
                            new Error(
                                "Unable to convert image."
                            )
                        );

                        return;

                    }


                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "Unable to read image."
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   ATTACHMENT
========================================================= */

function showAttachment(file){

function clearAttachment(){

function resetFileInput(){

/* =========================================================
   RECENT SEARCH
========================================================= */

function addRecentSearch(text){

    const clean =
        String(text).trim();


    if(!clean){
        return;
    }


    recentSearches =
        recentSearches.filter(
            item =>
                item.toLowerCase() !==
                clean.toLowerCase()
        );


    recentSearches.unshift(
        clean
    );


    recentSearches =
        recentSearches.slice(
            0,
            8
        );


    saveRecentSearches();

    renderRecentSearches();

}


function renderRecentSearches(){

    recentSearchList.innerHTML =
        "";


    if(!recentSearches.length){

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty-recent";

        empty.textContent =
            "Your recent AI questions will appear here.";

        recentSearchList.appendChild(
            empty
        );

        return;

    }


    recentSearches.forEach(
        (
            query,
            index
        ) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "recent-item";


            item.innerHTML = `

                <i class="fa-solid fa-clock-rotate-left"></i>

                <span></span>

                <small>
                    ${index === 0 ? "now" : "recent"}
                </small>

            `;


            item.querySelector(
                "span"
            ).textContent =
                query;


            item.onclick =
                () => {

                    chatInput.value =
                        query;

                    autoResizeTextarea();

                    chatInput.focus();

                };


            recentSearchList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   NEW CHAT
========================================================= */

function startNewChat(){

    if(messages.length){

        if(
            !confirm(
                "Start a new conversation?"
            )
        ){

            return;

        }

    }


    messages = [];

    saveMessages();

    removeChatMessages();

    clearAttachment();

    resetFileInput();

    chatInput.value = "";

    autoResizeTextarea();

    showWelcome();

    keepInputEnabled();

    chatInput.focus();

    showToast(
        "New conversation started."
    );

}


function removeChatMessages(){

    .querySelectorAll(
        ".message"
    )
    .forEach(
        element =>

    );

/* =========================================================
   CLEAR
========================================================= */

function clearHistory(){

    if(!messages.length){

        showToast(
            "There is no chat history."
        );

        return;

    }


    if(
        !confirm(
            "Clear this conversation?"
        )
    ){

        return;

    }


    messages = [];

    saveMessages();

    removeChatMessages();

    showWelcome();

    showToast(
        "Conversation cleared."
    );

}


/* =========================================================
   SAVE
========================================================= */

function saveCurrentChat(){

    if(!messages.length){

        showToast(
            "There is no conversation to save."
        );

        return;

    }


    const first =
        messages.find(
            item =>
                item.role === "user"
        );


    const title =
        first
        ? String(first.content || "")
            .slice(0,45)
        : "CivicAI Conversation";


    savedChats.unshift({

        id:Date.now(),

        title:
            title ||
            "CivicAI Conversation",

        messages:[
            ...messages
        ],

        savedAt:Date.now()

    });


    savedChats =
        savedChats.slice(
            0,
            10
        );


    saveSavedChats();


    showToast(
        "Conversation saved."
    );

}


/* =========================================================
   COPY
========================================================= */

async function copyConversation(){

    if(!messages.length){

        showToast(
            "There is no conversation to copy."
        );

        return;

    }


    const text =
        messages
        .map(
            item =>
                `${
                    item.role === "user"
                    ? "You"
                    : "CivicAI"
                }:\n${item.content}`
        )
        .join(
            "\n\n--------------------\n\n"
        );


    await copyText(text);

}


async function copyText(text){

    try{

        await navigator.clipboard.writeText(
            String(text)
        );


        showToast(
            "Copied to clipboard."
        );

    }
    catch{

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            String(text);


        document.body.appendChild(
            textarea
        );


        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();


        showToast(
            "Copied to clipboard."
        );

    }

}

/* =========================================================
   VOICE LANGUAGE
========================================================= */

function getVoiceLanguage(){

    const browserLanguage =
        (
            navigator.language ||
            "en-US"
        ).toLowerCase();


    /*
     * Bengali
     */

    if(
        browserLanguage.startsWith("bn")
    ){

        return "bn-IN";

    }


    /*
     * Hindi
     */

    if(
        browserLanguage.startsWith("hi")
    ){

        return "hi-IN";

    }


    /*
     * Tamil
     */

    if(
        browserLanguage.startsWith("ta")
    ){

        return "ta-IN";

    }


    /*
     * Telugu
     */

    if(
        browserLanguage.startsWith("te")
    ){

        return "te-IN";

    }


    /*
     * English India
     */

    if(
        browserLanguage.startsWith("en")
    ){

        return browserLanguage.includes("gb")
        ? "en-GB"
        : "en-IN";

    }


    return navigator.language || "en-US";

}


/* =========================================================
   VOICE RECOGNITION SETUP
========================================================= */

function setupVoiceRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        console.warn(
            "Speech Recognition unavailable."
        );

        voiceButton.title =
            "Voice recognition is not supported";

        return;

    }


    recognition =
        new SpeechRecognition();


    /*
     * CONTINUOUS IS VERY IMPORTANT.
     */

    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.lang =
        getVoiceLanguage();


    /* =====================================================
       RESULT
    ===================================================== */

    recognition.onresult =
        event => {

            let finalText = "";


            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){

                const transcript =
                    event.results[i][0]
                        .transcript;


                if(
                    event.results[i].isFinal
                ){

                    finalText +=
                        transcript;

                }

            }


            /*
             * ONLY FINAL RESULT GOES INTO TEXT BOX.
             */

            if(
                finalText.trim()
            ){

                const existing =
                    chatInput.value.trim();


                if(existing){

                    chatInput.value =
                        existing +
                        " " +
                        finalText.trim();

                }
                else{

                    chatInput.value =
                        finalText.trim();

                }


                autoResizeTextarea();

                keepInputEnabled();

                chatInput.focus();

            }

        };


    /* =====================================================
       ERROR
    ===================================================== */

    recognition.onerror =
        event => {

            console.error(
                "Voice recognition error:",
                event.error
            );


            if(
                event.error === "not-allowed" ||
                event.error === "service-not-allowed"
            ){

                voiceAssistantEnabled =
                    false;

                voiceListening =
                    false;

                updateVoiceUI();

                showToast(
                    "Microphone permission denied."
                );

                return;

            }


            /*
             * For temporary errors,
             * keep assistant alive.
             */

            if(
                voiceAssistantEnabled &&
                event.error !== "aborted"
            ){

                setTimeout(
                    restartRecognition,
                    500
                );

            }

        };


    /* =====================================================
       END
    ===================================================== */

    recognition.onend =
        () => {

            voiceListening =
                false;


            /*
             * DO NOT TURN OFF VOICE ASSISTANT.
             */

            if(
                voiceAssistantEnabled
            ){

                setTimeout(
                    restartRecognition,
                    350
                );

            }
            else{

                updateVoiceUI();

            }

        };


    recognition.onstart =
        () => {

            voiceListening =
                true;

            updateVoiceUI();

        };

}


/* =========================================================
   START LISTENING
========================================================= */

function startVoiceAssistant(){

    if(!recognition){

        showToast(
            "Voice recognition is not supported in this browser. Try Chrome or Edge."
        );

        return;

    }


    voiceAssistantEnabled =
        true;


    updateVoiceUI();


    restartRecognition();

}


/* =========================================================
   RESTART RECOGNITION
========================================================= */

function restartRecognition(){

    if(
        !voiceAssistantEnabled ||
        !recognition
    ){

        return;

    }


    if(voiceListening){

        return;

    }


    /*
     * Update language each time.
     */

    recognition.lang =
        getVoiceLanguage();


    try{

        recognition.start();

    }
    catch(error){

        /*
         * Browser throws if recognition
         * is already starting/running.
         */

        console.log(
            "Recognition restart:",
            error.message
        );

    }

}


/* =========================================================
   STOP VOICE
========================================================= */

function stopVoiceAssistant(){

    voiceAssistantEnabled =
        false;

    voiceListening =
        false;


    if(
        "speechSynthesis" in window
    ){

        speechWasInterrupted =
            true;

        window.speechSynthesis.cancel();

    }


    if(recognition){

        try{

            recognition.stop();

        }
        catch(error){

            console.log(error);

        }

    }


    updateVoiceUI();


    showToast(
        "Voice assistant turned off."
    );

}


/* =========================================================
   VOICE UI
========================================================= */

function updateVoiceUI(){

    if(
        voiceAssistantEnabled
    ){

        voiceButton.classList.add(
            "voice-active"
        );


        voiceButton.innerHTML =
            '<i class="fa-solid fa-microphone-lines"></i>';


        voiceButton.title =
            "Voice assistant ON — click to turn off";


        voiceStatus.classList.add(
            "active"
        );


        voiceStatusText.textContent =
            voiceListening
            ? "Listening — speak naturally"
            : "Voice assistant is ON";


        document.body.classList.add(
            "voice-active"
        );

    }
    else{

        voiceButton.classList.remove(
            "voice-active"
        );


        voiceButton.innerHTML =
            '<i class="fa-solid fa-microphone"></i>';


        voiceButton.title =
            "Start voice assistant";


        voiceStatus.classList.remove(
            "active"
        );


        voiceStatusText.textContent =
            "Voice assistant is off";


        document.body.classList.remove(
            "voice-active"
        );

    }

}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speakAIResponse(text){

    if(
        !voiceAssistantEnabled
    ){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        showToast(
            "Your browser does not support AI voice output."
        );

        return;

    }


    const cleanText =
        String(text || "")
        .replace(
            /```[\s\S]*?```/g,
            ""
        )
        .replace(
            /[*#_]/g,
            ""
        )
        .replace(
            /https?:\/\/\S+/g,
            ""
        )
        .trim();


    if(!cleanText){
        return;
    }


    speechWasInterrupted =
        false;


    window.speechSynthesis.cancel();


    /*
     * Wait slightly after cancel()
     * to avoid Chrome speech queue issues.
     */

    setTimeout(
        () => {

            if(
                !voiceAssistantEnabled
            ){

                return;

            }


            const utterance =
                new SpeechSynthesisUtterance(
                    cleanText
                );


            const voices =
                window.speechSynthesis
                    .getVoices();


            /*
             * Prefer a female sounding
             * available system voice.
             */

            const preferredVoice =
                voices.find(
                    voice =>
                        /female|samantha|zira|google.*female|microsoft.*zira|microsoft.*sara/i
                            .test(
                                voice.name
                            )
                );


            if(preferredVoice){

                utterance.voice =
                    preferredVoice;

            }


            /*
             * Detect language from the
             * actual text where possible.
             */

            if(
                /[\u0980-\u09FF]/
                    .test(cleanText)
            ){

                utterance.lang =
                    "bn-IN";

            }
            else if(
                /[\u0900-\u097F]/
                    .test(cleanText)
            ){

                utterance.lang =
                    "hi-IN";

            }
            else if(
                /[\u0B80-\u0BFF]/
                    .test(cleanText)
            ){

                utterance.lang =
                    "ta-IN";

            }
            else{

                utterance.lang =
                    getVoiceLanguage();

            }


            utterance.rate =
                0.94;


            utterance.pitch =
                1.08;


            utterance.volume =
                1;


            utterance.onstart =
                () => {

                    document.body.classList.add(
                        "voice-active"
                    );

                };


            utterance.onend =
                () => {

                    /*
                     * IMPORTANT:
                     * Voice mode stays ON.
                     *
                     * After AI finishes speaking,
                     * microphone starts listening again.
                     */

                    if(
                        voiceAssistantEnabled &&
                        !speechWasInterrupted
                    ){

                        setTimeout(
                            restartRecognition,
                            400
                        );

                    }

                };


            utterance.onerror =
                error => {

                    console.error(
                        "Speech synthesis:",
                        error
                    );


                    if(
                        voiceAssistantEnabled
                    ){

                        setTimeout(
                            restartRecognition,
                            500
                        );

                    }

                };


            window.speechSynthesis.speak(
                utterance
            );


        },
        180
    );

}
