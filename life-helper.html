<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CivicAI — AI Life Helper</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* =========================================================
   CIVICAI — COMPLETE SINGLE FILE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#060b16;
    --bg2:#0a1020;
    --panel:#0d1424;
    --panel2:#111a2d;

    --border:rgba(255,255,255,0.08);
    --border-light:rgba(255,255,255,0.13);

    --text:#f5f7fb;
    --text2:#aeb8ca;
    --muted:#737f94;

    --primary:#5b7cff;
    --primary2:#7c5cff;

    --green:#2dd4bf;
    --red:#ff5d73;
    --yellow:#fbbf24;

    --shadow:
        0 20px 60px rgba(0,0,0,0.35);

    --radius:18px;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(91,124,255,0.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(124,92,255,0.10),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    overflow:hidden;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:280px;
    height:100vh;

    background:
        rgba(8,13,26,0.92);

    border-right:
        1px solid var(--border);

    display:flex;
    flex-direction:column;

    padding:18px;

    position:relative;
    z-index:20;

    backdrop-filter:blur(20px);
}

.logo{

    display:flex;
    align-items:center;
    gap:12px;

    padding:8px 8px 22px;
}

.logo-icon{

    width:42px;
    height:42px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 8px 25px rgba(91,124,255,0.25);

    font-size:18px;
}

.logo-text{

    font-size:20px;
    font-weight:800;
    letter-spacing:-0.5px;
}

.logo-text span{
    color:#8295ff;
}


/* =========================================================
   NEW CHAT
========================================================= */

.new-chat{

    width:100%;

    border:
        1px solid var(--border-light);

    background:
        linear-gradient(
            135deg,
            rgba(91,124,255,0.18),
            rgba(124,92,255,0.10)
        );

    color:var(--text);

    border-radius:14px;

    padding:13px 15px;

    display:flex;
    align-items:center;
    gap:10px;

    cursor:pointer;

    font-size:14px;
    font-weight:700;

    transition:0.25s ease;
}

.new-chat:hover{

    transform:translateY(-2px);

    border-color:
        rgba(124,92,255,0.5);

    background:
        linear-gradient(
            135deg,
            rgba(91,124,255,0.28),
            rgba(124,92,255,0.18)
        );
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

    margin:18px 0;
    position:relative;
}

.search-box i{

    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:13px;
}

.search-box input{

    width:100%;

    padding:11px 12px 11px 36px;

    border-radius:12px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,0.035);

    color:var(--text);

    outline:none;

    font-size:13px;

    transition:0.2s;
}

.search-box input:focus{

    border-color:
        rgba(91,124,255,0.55);

    background:
        rgba(255,255,255,0.05);
}

.search-box input::placeholder{
    color:#667187;
}


/* =========================================================
   SIDEBAR SECTION
========================================================= */

.sidebar-title{

    color:var(--muted);

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1.2px;

    font-weight:800;

    margin:
        5px 5px 10px;
}

.recent-list{

    overflow-y:auto;

    flex:1;

    min-height:0;
}

.recent-list::-webkit-scrollbar{
    width:4px;
}

.recent-list::-webkit-scrollbar-thumb{

    background:#273149;
    border-radius:10px;
}

.recent-item{

    display:flex;
    align-items:center;
    gap:10px;

    padding:11px 10px;

    border-radius:11px;

    cursor:pointer;

    color:var(--text2);

    font-size:12px;

    transition:0.2s;
}

.recent-item:hover{

    background:
        rgba(255,255,255,0.05);

    color:white;
}

.recent-item i{

    color:#687cff;
    width:15px;
}

.recent-item span{

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    flex:1;
}

.recent-item small{

    color:#59647a;
    font-size:9px;
}

.empty-recent{

    color:var(--muted);

    font-size:12px;

    line-height:1.6;

    padding:10px;
}


/* =========================================================
   SIDEBAR BOTTOM
========================================================= */

.sidebar-bottom{

    border-top:
        1px solid var(--border);

    padding-top:14px;

    margin-top:12px;
}

.sidebar-btn{

    width:100%;

    display:flex;
    align-items:center;

    gap:11px;

    background:transparent;

    border:none;

    color:var(--text2);

    padding:11px 10px;

    border-radius:11px;

    cursor:pointer;

    font-size:13px;

    transition:0.2s;
}

.sidebar-btn:hover{

    background:
        rgba(255,255,255,0.05);

    color:white;
}

.sidebar-btn i{
    width:18px;
}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    min-width:0;

    height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0 28px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(6,11,22,0.68);

    backdrop-filter:blur(20px);

    flex-shrink:0;
}

.header-left{

    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{

    display:none;

    border:none;

    background:transparent;

    color:white;

    font-size:19px;

    cursor:pointer;
}

.header-title{

    font-weight:750;
    font-size:15px;
}

.status{

    display:flex;
    align-items:center;
    gap:7px;

    font-size:11px;

    color:var(--text2);
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px
        rgba(45,212,191,0.8);
}

.header-actions{

    display:flex;
    gap:7px;
}

.icon-btn{

    width:38px;
    height:38px;

    border-radius:11px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,0.035);

    color:var(--text2);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:0.2s;
}

.icon-btn:hover{

    color:white;

    border-color:
        rgba(91,124,255,0.5);

    transform:translateY(-1px);
}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        30px 20px 180px;
}

.chat-area::-webkit-scrollbar{
    width:6px;
}

.chat-area::-webkit-scrollbar-thumb{

    background:#273149;
    border-radius:20px;
}

.chat-container{

    width:min(900px,100%);

    margin:auto;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome{

    min-height:52vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 10px;
}

.welcome-logo{

    width:76px;
    height:76px;

    border-radius:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;

    background:
        linear-gradient(
            135deg,
            #5b7cff,
            #8b5cf6
        );

    box-shadow:
        0 18px 50px
        rgba(91,124,255,0.25);

    margin-bottom:24px;

    animation:
        floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.welcome h1{

    font-size:
        clamp(30px,5vw,48px);

    letter-spacing:-1.5px;

    margin-bottom:12px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #aab7ff
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.welcome p{

    color:var(--text2);

    max-width:620px;

    line-height:1.7;

    font-size:14px;
}


/* =========================================================
   MESSAGES
========================================================= */

.message{

    display:flex;

    gap:12px;

    margin-bottom:24px;

    animation:
        messageIn 0.3s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    flex-direction:row-reverse;
}

.message-avatar{

    width:36px;
    height:36px;

    flex-shrink:0;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #5b7cff,
            #7c5cff
        );

    font-size:13px;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,0.25);
}

.message.user .message-avatar{

    background:
        linear-gradient(
            135deg,
            #27344e,
            #1c263a
        );
}

.message-body{

    max-width:min(75%,720px);
}

.message.user .message-body{
    text-align:right;
}

.message-bubble{

    padding:
        14px 17px;

    border-radius:17px;

    background:
        rgba(255,255,255,0.045);

    border:
        1px solid var(--border);

    color:#e9edf5;

    line-height:1.7;

    font-size:14px;

    word-wrap:break-word;

    text-align:left;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,0.12);
}

.message.user .message-bubble{

    background:
        linear-gradient(
            135deg,
            rgba(91,124,255,0.20),
            rgba(124,92,255,0.16)
        );

    border-color:
        rgba(91,124,255,0.2);
}

.message-bubble strong{
    color:white;
}

.message-bubble pre{

    background:#050913;

    border:
        1px solid var(--border);

    padding:14px;

    border-radius:10px;

    overflow-x:auto;

    margin:10px 0;

    text-align:left;
}

.message-bubble code{

    font-family:
        Consolas,
        monospace;

    font-size:12px;
}

.message-bubble ul,
.message-bubble ol{

    margin:
        8px 0 8px 20px;
}

.message-bubble li{
    margin-bottom:4px;
}

.message-meta{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:5px;

    color:#5e697d;

    font-size:10px;
}

.message.user .message-meta{
    justify-content:flex-end;
}

.message-actions{

    display:flex;
    gap:5px;
}

.message-actions button{

    border:none;

    background:transparent;

    color:#657188;

    cursor:pointer;

    padding:2px 5px;

    font-size:11px;
}

.message-actions button:hover{
    color:white;
}


/* =========================================================
   TYPING
========================================================= */

.typing{

    display:none;

    align-items:center;

    gap:10px;

    margin-bottom:20px;
}

.typing.show{
    display:flex;
}

.typing-avatar{

    width:36px;
    height:36px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #5b7cff,
            #7c5cff
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.typing-bubble{

    padding:13px 16px;

    background:
        rgba(255,255,255,0.04);

    border:
        1px solid var(--border);

    border-radius:15px;
}

.typing-dots{

    display:flex;
    gap:4px;
}

.typing-dots span{

    width:6px;
    height:6px;

    background:#8490ff;

    border-radius:50%;

    animation:
        dot 1.2s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{

    0%,
    60%,
    100%{
        transform:translateY(0);
        opacity:.45;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}


/* =========================================================
   INPUT
========================================================= */

.input-wrapper{

    position:absolute;

    bottom:0;
    left:0;
    right:0;

    padding:
        20px 20px 24px;

    background:
        linear-gradient(
            to top,
            var(--bg) 65%,
            transparent
        );

    z-index:10;
}

.input-container{

    width:min(900px,100%);

    margin:auto;

    position:relative;

    border:
        1px solid var(--border-light);

    background:
        rgba(13,20,36,0.90);

    border-radius:20px;

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(20px);

    transition:.25s;
}

.input-container:focus-within{

    border-color:
        rgba(91,124,255,0.45);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,0.45),
        0 0 0 3px
        rgba(91,124,255,0.05);
}

.attachment-preview{

    display:none;

    align-items:center;

    gap:9px;

    margin:
        12px 14px 0;

    padding:9px 11px;

    border-radius:10px;

    background:
        rgba(91,124,255,0.08);

    border:
        1px solid
        rgba(91,124,255,0.16);

    font-size:12px;
}

.attachment-preview.show{
    display:flex;
}

.attachment-preview i{
    color:#8190ff;
}

.attachment-preview span{

    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.remove-attachment{

    border:none;

    background:transparent;

    color:#8792a6;

    cursor:pointer;
}

.remove-attachment:hover{
    color:#ff7182;
}

.input-row{

    display:flex;

    align-items:flex-end;

    gap:8px;

    padding:12px;
}

.input-actions{

    display:flex;

    gap:4px;
}

.tool-btn{

    width:38px;
    height:38px;

    border:none;

    border-radius:11px;

    background:transparent;

    color:#7b879c;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.tool-btn:hover{

    background:
        rgba(255,255,255,0.05);

    color:white;
}

.chat-input{

    flex:1;

    min-width:0;

    max-height:130px;

    resize:none;

    overflow-y:auto;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    padding:
        9px 5px;

    font-size:14px;

    line-height:1.5;

    font-family:inherit;
}

.chat-input::placeholder{
    color:#69758a;
}

.send-btn{

    width:42px;
    height:42px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #5b7cff,
            #7c5cff
        );

    color:white;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 8px 22px
        rgba(91,124,255,0.25);

    transition:.25s;
}

.send-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(91,124,255,0.38);
}

.send-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;
}

.input-footer{

    text-align:center;

    color:#4f5a6d;

    font-size:10px;

    padding:
        0 15px 10px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    bottom:95px;
    left:50%;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#151e32;

    color:white;

    border:
        1px solid var(--border-light);

    border-radius:12px;

    padding:
        11px 17px;

    font-size:12px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    transition:.3s;

    z-index:100;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   LIGHT MODE
========================================================= */

body.light-mode{

    --bg:#f5f7fb;
    --bg2:#edf1f7;
    --panel:#ffffff;
    --panel2:#f1f4f9;

    --border:rgba(20,30,50,0.09);
    --border-light:rgba(20,30,50,0.15);

    --text:#172033;
    --text2:#596579;
    --muted:#7d8797;
}

body.light-mode{

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(91,124,255,.10),
            transparent 30%
        ),
        #f5f7fb;

    color:#172033;
}

body.light-mode .sidebar{

    background:
        rgba(255,255,255,.9);
}

body.light-mode .header{

    background:
        rgba(245,247,251,.85);
}

body.light-mode .input-container{

    background:
        rgba(255,255,255,.9);
}

body.light-mode .message-bubble{

    background:
        rgba(20,30,50,.035);

    color:#253149;
}

body.light-mode .message.user .message-bubble{

    background:
        rgba(91,124,255,.10);
}

body.light-mode .chat-input{
    color:#172033;
}

body.light-mode .logo-text{
    color:#172033;
}

body.light-mode .sidebar-btn,
body.light-mode .icon-btn{
    color:#596579;
}

body.light-mode .icon-btn{

    background:
        rgba(20,30,50,.035);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .sidebar{

        position:fixed;

        left:-300px;

        top:0;

        height:100%;

        transition:.3s;

        box-shadow:
            20px 0 50px
            rgba(0,0,0,.3);
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .header{
        padding:
            0 15px;
    }

    .chat-area{
        padding:
            20px 12px 170px;
    }

    .input-wrapper{
        padding:
            15px 10px 18px;
    }

    .message-body{
        max-width:82%;
    }

    .welcome{
        min-height:48vh;
    }
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:500px){

    .header-title{
        font-size:13px;
    }

    .status{
        display:none;
    }

    .welcome h1{
        font-size:31px;
    }

    .welcome p{
        font-size:13px;
    }

    .welcome-logo{

        width:65px;
        height:65px;

        border-radius:21px;
    }

    .message-avatar{

        width:32px;
        height:32px;

        border-radius:10px;
    }

    .message-body{
        max-width:84%;
    }

    .message-bubble{

        font-size:13px;

        padding:
            12px 13px;
    }

    .tool-btn{

        width:34px;
        height:34px;
    }

    .send-btn{

        width:39px;
        height:39px;
    }

}

</style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-brain"></i>
            </div>

            <div class="logo-text">
                Civic<span>AI</span>
            </div>

        </div>


        <button
            class="new-chat"
            id="sidebarNewChat">

            <i class="fa-solid fa-plus"></i>

            New conversation

        </button>


        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="chatSearch"
                placeholder="Search chats...">

        </div>


        <div class="sidebar-title">
            Recent
        </div>


        <div
            class="recent-list"
            id="recentSearchList">
        </div>


        <div class="sidebar-bottom">

            <button
                class="sidebar-btn"
                id="saveChatButton">

                <i class="fa-regular fa-bookmark"></i>

                Save conversation

            </button>


            <button
                class="sidebar-btn"
                id="exportChatButton">

                <i class="fa-solid fa-copy"></i>

                Copy conversation

</div>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const sidebar = document.getElementById("sidebar");
    const mobileMenu = document.getElementById("mobileMenu");

    const chatMessages = document.getElementById("chatMessages");
    const chatContainer = document.getElementById("chatContainer");

    const chatInput = document.getElementById("chatInput");
    const sendButton = document.getElementById("sendButton");

    const fileButton = document.getElementById("fileButton");
    const fileInput = document.getElementById("fileInput");
    const cameraButton = document.getElementById("cameraButton");
    const voiceButton = document.getElementById("voiceButton");

    const typingIndicator =
        document.getElementById("typingIndicator");

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    const newChatButton =
        document.getElementById("newChatButton");

    const sidebarNewChat =
        document.getElementById("sidebarNewChat");

    const clearHistoryButton =
        document.getElementById("clearHistoryButton");

    const saveChatButton =
        document.getElementById("saveChatButton");

    const exportChatButton =
        document.getElementById("exportChatButton");

    const themeButton =
        document.getElementById("themeButton");

    const attachmentPreview =
        document.getElementById("attachmentPreview");

    const attachmentName =
        document.getElementById("attachmentName");

    const attachmentIcon =
        document.getElementById("attachmentIcon");

    const removeAttachment =
        document.getElementById("removeAttachment");

    const recentSearchList =
        document.getElementById("recentSearchList");

    const chatSearch =
        document.getElementById("chatSearch");

    const helperToast =
        document.getElementById("helperToast");


    /* =========================================================
       BACKEND ENDPOINTS
       
       IMPORTANT:
       Normal Live Helper -> /api/chat -> Groq
       Civic analysis       -> /api/analyze
    ========================================================= */

    const CHAT_API_ENDPOINT = "/api/chat";
    const ANALYZE_API_ENDPOINT = "/api/analyze";


    /* =========================================================
       STATE
    ========================================================= */

    let selectedFile = null;
    let messages = [];
    let recentSearches = [];
    let savedChats = [];

    let isSending = false;
    let activeRecognition = null;


    /* =========================================================
       STORAGE
    ========================================================= */

    const STORAGE_MESSAGES = "civicai_messages";
    const STORAGE_RECENT = "civicai_recent";
    const STORAGE_SAVED = "civicai_saved";
    const STORAGE_THEME = "civicai_theme";


    /* =========================================================
       INITIALIZE
    ========================================================= */

    loadStorage();
    renderRecentSearches();
    applySavedTheme();
    autoResizeTextarea();


    /* =========================================================
       STORAGE
    ========================================================= */

    function loadStorage() {

        try {

            const savedMessages =
                localStorage.getItem(STORAGE_MESSAGES);

            const savedRecent =
                localStorage.getItem(STORAGE_RECENT);

            const saved =
                localStorage.getItem(STORAGE_SAVED);


            if (savedMessages) {

                const parsed =
                    JSON.parse(savedMessages);

                if (Array.isArray(parsed)) {
                    messages = parsed;
                }

            }


            if (savedRecent) {

                const parsed =
                    JSON.parse(savedRecent);

                if (Array.isArray(parsed)) {
                    recentSearches = parsed;
                }

            }


            if (saved) {

                const parsed =
                    JSON.parse(saved);

                if (Array.isArray(parsed)) {
                    savedChats = parsed;
                }

            }


            if (messages.length) {
                restoreMessages();
            }

        }

        catch (error) {

            console.error(
                "CivicAI storage error:",
                error
            );

            messages = [];
            recentSearches = [];
            savedChats = [];

        }

    }


    function saveMessages() {

        try {

            localStorage.setItem(
                STORAGE_MESSAGES,
                JSON.stringify(messages)
            );

        }

        catch (error) {

            console.error(
                "Unable to save messages:",
                error
            );

        }

    }


    function saveRecentSearches() {

        try {

            localStorage.setItem(
                STORAGE_RECENT,
                JSON.stringify(recentSearches)
            );

        }

        catch (error) {

            console.error(
                "Unable to save recent searches:",
                error
            );

        }

    }


    function saveSavedChats() {

        try {

            localStorage.setItem(
                STORAGE_SAVED,
                JSON.stringify(savedChats)
            );

        }

        catch (error) {

            console.error(
                "Unable to save saved chats:",
                error
            );

        }

    }


    /* =========================================================
       WELCOME
    ========================================================= */

    function hideWelcome() {

        if (welcomeScreen) {
            welcomeScreen.style.display = "none";
        }

    }


    function showWelcome() {

        if (welcomeScreen) {
            welcomeScreen.style.display = "flex";
        }

    }


    /* =========================================================
       RESTORE MESSAGES
    ========================================================= */

    function restoreMessages() {

        hideWelcome();

        messages.forEach(message => {

            if (
                message &&
                (message.role === "user" ||
                 message.role === "ai") &&
                typeof message.content === "string"
            ) {

                renderMessage(
                    message.role,
                    message.content,
                    false
                );

            }

        });

        scrollToBottom();

    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(text) {

        if (!helperToast) {
            return;
        }

        helperToast.textContent =
            String(text);

        helperToast.classList.add("show");

        clearTimeout(showToast.timer);

        showToast.timer =
            setTimeout(() => {

                helperToast.classList.remove("show");

            }, 2800);

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text ?? "";

        return div.innerHTML;

    }


    /* =========================================================
       FORMAT MESSAGE
    ========================================================= */

    function formatMessage(text) {

        if (!text) {
            return "";
        }

        let html =
            escapeHTML(String(text));


        /*
         * CODE BLOCKS
         */

        html = html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );


        /*
         * INLINE CODE
         */

        html = html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


        /*
         * BOLD
         */

        html = html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


        /*
         * ITALIC
         */

        html = html.replace(
            /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


        /*
         * BULLET
         */

        html = html.replace(
            /^• (.*)$/gm,
            "<div>• $1</div>"
        );


        /*
         * MARKDOWN BULLET
         */

        html = html.replace(
            /^- (.*)$/gm,
            "<div>• $1</div>"
        );


        /*
         * NUMBERED LIST
         */

        html = html.replace(
            /^(\d+)\.\s+(.*)$/gm,
            "<div>$1. $2</div>"
        );


        /*
         * NEW LINES
         */

        html = html.replace(
            /\n/g,
            "<br>"
        );


        return html;

    }


    /* =========================================================
       RENDER MESSAGE
    ========================================================= */

    function renderMessage(
        role,
        content,
        save = true
    ) {

        hideWelcome();


        const message =
            document.createElement("div");

        message.className =
            `message ${role}`;


        const avatar =
            document.createElement("div");

        avatar.className =
            "message-avatar";


        avatar.innerHTML =
            role === "ai"
                ? '<i class="fa-solid fa-brain"></i>'
                : '<i class="fa-solid fa-user"></i>';


        const body =
            document.createElement("div");

        body.className =
            "message-body";


        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";


        bubble.innerHTML =
            formatMessage(content);


        const meta =
            document.createElement("div");

        meta.className =
            "message-meta";


        const time =
            document.createElement("span");

        time.textContent =
            getCurrentTime();


        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        if (role === "ai") {

            const copy =
                document.createElement("button");

            copy.type = "button";

            copy.innerHTML =
                '<i class="fa-regular fa-copy"></i>';

            copy.title =
                "Copy response";

            copy.onclick =
                () => copyText(content);

            actions.appendChild(copy);

        }


        meta.appendChild(time);
        meta.appendChild(actions);

        body.appendChild(bubble);
        body.appendChild(meta);

        message.appendChild(avatar);
        message.appendChild(body);


        if (
            typingIndicator &&
            typingIndicator.parentNode === chatContainer
        ) {

            chatContainer.insertBefore(
                message,
                typingIndicator
            );

        }

        else {

            chatContainer.appendChild(
                message
            );

        }


        if (save) {

            messages.push({

                role: role,

                content: String(content),

                time: Date.now()

            });

            saveMessages();

        }


        scrollToBottom();

    }


    /* =========================================================
       TIME
    ========================================================= */

    function getCurrentTime() {

        return new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        });

    }


    /* =========================================================
       TYPING
    ========================================================= */

    function showTyping() {

        if (!typingIndicator) {
            return;
        }

        typingIndicator.classList.add("show");

        scrollToBottom();

    }


    function hideTyping() {

        if (!typingIndicator) {
            return;
        }

        typingIndicator.classList.remove("show");

    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        if (isSending) {
            return;
        }


        const text =
            String(chatInput.value || "").trim();

        const file =
            selectedFile;


        if (!text && !file) {

            showToast(
                "Write a message or attach an image."
            );

            chatInput.focus();

            return;

        }


        isSending = true;

        sendButton.disabled = true;


        let userMessage =
            text;


        if (file) {

            userMessage =
                text
                    ? `${text}\n\n📎 Attached: ${file.name}`
                    : `📎 Attached: ${file.name}`;

        }


        /*
         * Render user message immediately.
         */

        renderMessage(
            "user",
            userMessage
        );


        if (text) {
            addRecentSearch(text);
        }


        /*
         * Clear input.
         */

        chatInput.value = "";

        autoResizeTextarea();

        showTyping();


        try {

            const response =
                await getAIResponse(
                    text,
                    file
                );


            hideTyping();


            renderMessage(
                "ai",
                response
            );

        }

        catch (error) {

            hideTyping();

            console.error(
                "CivicAI Live Helper error:",
                error
            );


            renderMessage(
                "ai",
                `**CivicAI couldn't process your request.**\n\n${error.message || "Unknown server error."}`
            );

        }

        finally {

            isSending = false;

            sendButton.disabled = false;

            clearAttachment();

            resetFileInput();

            chatInput.focus();

        }

    }


    /* =========================================================
       AI REQUEST
       
       TEXT -> /api/chat -> GROQ
       IMAGE -> /api/analyze
    ========================================================= */

    async function getAIResponse(
        text,
        file
    ) {

        const userText =
            String(text || "").trim();


        /*
         * IMAGE REQUEST
         */

        if (
            file &&
            file.type &&
            file.type.startsWith("image/")
        ) {

            const image =
                await fileToDataURL(file);


            const response =
                await fetch(
                    ANALYZE_API_ENDPOINT,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            description:
                                userText ||
                                "Please analyze this image carefully and answer naturally. Explain what you can understand from the image and provide useful guidance. Do not force the response into a predefined civic report format.",

                            location: "",

                            reporterName:
                                "CivicAI User",

                            image: image

                        })

                    }
                );


            return processServerResponse(
                response
            );

        }


        /*
         * OTHER FILE
         */

        if (file) {

            throw new Error(
                "Only image files are currently supported."
            );

        }


        /*
         * TEXT REQUEST
         *
         * THIS IS THE NORMAL LIVE HELPER.
         */

        if (!userText) {

            throw new Error(
                "Please enter a message."
            );

        }


        /*
         * Build conversation BEFORE
         * sending the current message.
         *
         * Current user message is already
         * rendered into messages.
         */

        const conversation =
            messages
                .slice(-20)
                .map(item => {

                    return {

                        role:
                            item.role === "ai"
                                ? "assistant"
                                : "user",

                        content:
                            String(item.content || "")

                    };

                });


        console.log(
            "CivicAI -> /api/chat",
            {
                message: userText,
                conversationLength:
                    conversation.length
            }
        );


        const response =
            await fetch(
                CHAT_API_ENDPOINT,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            userText,

                        conversation:
                            conversation

                    })

                }
            );


        return processServerResponse(
            response
        );

    }


    /* =========================================================
       PROCESS BACKEND RESPONSE
    ========================================================= */

    async function processServerResponse(
        response
    ) {

        const raw =
            await response.text();


        console.log(
            "CivicAI backend HTTP:",
            response.status
        );


        /*
         * Empty response
         */

        if (!raw) {

            throw new Error(
                `Backend returned an empty response. HTTP ${response.status}`
            );

        }


        let data;


        try {

            data =
                JSON.parse(raw);

        }

        catch (error) {

            console.error(
                "Invalid backend response:",
                raw
            );


            /*
             * This normally means Express returned
             * HTML instead of JSON.
             */

            if (
                raw.trim().startsWith("<")
            ) {

                throw new Error(
                    `Backend returned HTML instead of JSON. Check that CivicAI server is running and that ${CHAT_API_ENDPOINT} exists. HTTP ${response.status}`
                );

            }


            throw new Error(
                `Backend returned invalid JSON. HTTP ${response.status}`
            );

        }


        /*
         * HTTP ERROR
         */

        if (!response.ok) {

            const serverError =
                data?.error ||
                data?.message ||
                data?.details ||
                data?.response ||
                data?.answer;


            if (
                response.status === 401 ||
                Number(data?.groqStatus) === 401
            ) {

                throw new Error(
                    "Groq API key is invalid. Check GROQ_API_KEY in your .env file."
                );

            }


            if (
                response.status === 403
            ) {

                throw new Error(
                    serverError ||
                    "The AI request was forbidden."
                );

            }


            if (
                response.status === 404
            ) {

                throw new Error(
                    serverError ||
                    "The /api/chat endpoint was not found. Make sure your current server.js is running."
                );

            }


            if (
                response.status === 429
            ) {

                throw new Error(
                    serverError ||
                    "Groq rate limit reached. Please try again shortly."
                );

            }


            if (
                response.status >= 500
            ) {

                throw new Error(
                    serverError ||
                    "The CivicAI backend or Groq AI server returned an internal error."
                );

            }


            throw new Error(
                serverError ||
                `AI server error: HTTP ${response.status}`
            );

        }


        /*
         * SUCCESS
         */

        const answer =
            extractAIResponse(data);


        if (!answer) {

            console.error(
                "Backend returned no AI text:",
                data
            );


            throw new Error(
                "Backend responded successfully but did not return an AI answer."
            );

        }


        return answer.trim();

    }


    /* =========================================================
       EXTRACT AI RESPONSE
    ========================================================= */

    function extractAIResponse(data) {

        if (typeof data === "string") {
            return data;
        }


        if (!data || typeof data !== "object") {
            return "";
        }


        /*
         * Standard CivicAI response fields.
         */

        const fields = [

            "answer",
            "response",
            "reply",
            "message",
            "text",
            "content",
            "analysis"

        ];


        for (const key of fields) {

            if (
                typeof data[key] === "string" &&
                data[key].trim()
            ) {

                return data[key].trim();

            }

        }


        /*
         * Nested response.
         */

        if (
            data.response &&
            typeof data.response === "object"
        ) {

            const nested =
                extractAIResponse(
                    data.response
                );

            if (nested) {
                return nested;
            }

        }


        if (
            data.answer &&
            typeof data.answer === "object"
        ) {

            const nested =
                extractAIResponse(
                    data.answer
                );

            if (nested) {
                return nested;
            }

        }


        if (
            data.analysis &&
            typeof data.analysis === "object"
        ) {

            const nested =
                extractAIResponse(
                    data.analysis
                );

            if (nested) {
                return nested;
            }

        }


        return "";

    }


    /* =========================================================
       FILE TO DATA URL
    ========================================================= */

    function fileToDataURL(file) {

        return new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();


                reader.onload =
                    () => {

                        if (
                            typeof reader.result !==
                            "string"
                        ) {

                            reject(
                                new Error(
                                    "Unable to convert image."
                                )
                            );

                            return;

                        }


                        resolve(
                            reader.result
                        );

                    };


                reader.onerror =
                    () => {

                        reject(
                            new Error(
                                "Unable to read image."
                            )
                        );

                    };


                reader.readAsDataURL(file);

            }
        );

    }


    /* =========================================================
       ATTACHMENT
    ========================================================= */

    function showAttachment(file) {

        selectedFile =
            file;


        attachmentName.textContent =
            file.name;


        if (
            file.type &&
            file.type.startsWith("image/")
        ) {

            attachmentIcon.className =
                "fa-solid fa-image";

        }

        else {

            attachmentIcon.className =
                "fa-solid fa-file";

        }


        attachmentPreview.classList.add(
            "show"
        );

    }


    function clearAttachment() {

        selectedFile =
            null;


        attachmentPreview.classList.remove(
            "show"
        );


        attachmentName.textContent =
            "";

    }


    function resetFileInput() {

        fileInput.value =
            "";

        fileInput.setAttribute(
            "accept",
            "image/*"
        );

        fileInput.removeAttribute(
            "capture"
        );

    }


    /* =========================================================
       RECENT SEARCH
    ========================================================= */

    function addRecentSearch(text) {

        const clean =
            String(text).trim();


        if (!clean) {
            return;
        }


        recentSearches =
            recentSearches.filter(
                item =>
                    item.toLowerCase() !==
                    clean.toLowerCase()
            );


        recentSearches.unshift(
            clean
        );


        recentSearches =
            recentSearches.slice(
                0,
                8
            );


        saveRecentSearches();

        renderRecentSearches();

    }


    function renderRecentSearches() {

        recentSearchList.innerHTML =
            "";


        if (!recentSearches.length) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty-recent";


            empty.textContent =
                "Your recent AI questions will appear here.";


            recentSearchList.appendChild(
                empty
            );


            return;

        }


        recentSearches.forEach(
            (
                query,
                index
            ) => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "recent-item";


                item.innerHTML = `

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span></span>

                    <small>
                        ${index === 0 ? "now" : "recent"}
                    </small>

                `;


                item.querySelector(
                    "span"
                ).textContent =
                    query;


                item.onclick =
                    () => {

                        chatInput.value =
                            query;

                        autoResizeTextarea();

                        chatInput.focus();

                    };


                recentSearchList.appendChild(
                    item
                );

            }
        );

    }


    /* =========================================================
       NEW CHAT
    ========================================================= */

    function startNewChat() {

        if (messages.length) {

            if (
                !confirm(
                    "Start a new conversation?"
                )
            ) {

                return;

            }

        }


        messages = [];

        saveMessages();

        removeChatMessages();

        clearAttachment();

        resetFileInput();

        chatInput.value = "";

        autoResizeTextarea();

        showWelcome();

        chatInput.focus();

        showToast(
            "New conversation started."
        );

    }


    function removeChatMessages() {

        chatContainer
            .querySelectorAll(
                ".message"
            )
            .forEach(
                element =>
                    element.remove()
            );

    }


    /* =========================================================
       CLEAR HISTORY
    ========================================================= */

    function clearHistory() {

        if (!messages.length) {

            showToast(
                "There is no chat history."
            );

            return;

        }


        if (
            !confirm(
                "Clear this conversation?"
            )
        ) {

            return;

        }


        messages = [];

        saveMessages();

        removeChatMessages();

        showWelcome();

        showToast(
            "Conversation cleared."
        );

    }


    /* =========================================================
       SAVE CHAT
    ========================================================= */

    function saveCurrentChat() {

        if (!messages.length) {

            showToast(
                "There is no conversation to save."
            );

            return;

        }


        const first =
            messages.find(
                item =>
                    item.role === "user"
            );


        let title =
            first
                ? String(first.content || "")
                    .replace(
                        /📎 Attached:.*$/s,
                        ""
                    )
                    .trim()
                    .slice(0, 45)
                : "CivicAI Conversation";


        savedChats.unshift({

            id:
                Date.now(),

            title:
                title || "CivicAI Conversation",

            messages:
                [...messages],

            savedAt:
                Date.now()

        });


        savedChats =
            savedChats.slice(
                0,
                10
            );


        saveSavedChats();


        showToast(
            "Conversation saved."
        );

    }


    /* =========================================================
       COPY CONVERSATION
    ========================================================= */

    async function copyConversation() {

        if (!messages.length) {

            showToast(
                "There is no conversation to copy."
            );

            return;

        }


        const text =
            messages
                .map(
                    item =>
                        `${
                            item.role === "user"
                                ? "You"
                                : "CivicAI"
                        }:\n${item.content}`
                )
                .join(
                    "\n\n--------------------\n\n"
                );


        await copyText(text);

    }


    async function copyText(text) {

        try {

            await navigator.clipboard.writeText(
                String(text)
            );


            showToast(
                "Copied to clipboard."
            );

        }

        catch {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                String(text);


            document.body.appendChild(
                textarea
            );


            textarea.select();

            document.execCommand(
                "copy"
            );


            textarea.remove();


            showToast(
                "Copied to clipboard."
            );

        }

    }


    /* =========================================================
       THEME
    ========================================================= */

    function applySavedTheme() {

        const theme =
            localStorage.getItem(
                STORAGE_THEME
            );


        document.body.classList.toggle(
            "light-mode",
            theme === "light"
        );


        updateThemeButton();

    }


    function updateThemeButton() {

        const light =
            document.body.classList.contains(
                "light-mode"
            );


        themeButton.innerHTML =
            light
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';

    }


    function toggleTheme() {

        const light =
            document.body.classList.toggle(
                "light-mode"
            );


        localStorage.setItem(
            STORAGE_THEME,
            light
                ? "light"
                : "dark"
        );


        updateThemeButton();

    }


    /* =========================================================
       TEXTAREA
    ========================================================= */

    function autoResizeTextarea() {

        chatInput.style.height =
            "auto";


        chatInput.style.height =
            Math.min(
                chatInput.scrollHeight,
                130
            ) + "px";

    }


    /* =========================================================
       VOICE INPUT
    ========================================================= */

    function startVoiceInput() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            showToast(
                "Voice input is not supported in this browser."
            );

            return;

        }


        if (activeRecognition) {

            activeRecognition.stop();

            activeRecognition =
                null;

            return;

        }


        const recognition =
            new SpeechRecognition();


        activeRecognition =
            recognition;


        recognition.lang =
            navigator.language ||
            "en-US";


        recognition.interimResults =
            false;


        recognition.maxAlternatives =
            1;


        showToast(
            "Listening..."
        );


        recognition.onresult =
            event => {

                const transcript =
                    event.results[0][0]
                        .transcript;


                chatInput.value +=
                    (
                        chatInput.value
                            ? " "
                            : ""
                    ) +
                    transcript;


                autoResizeTextarea();

                chatInput.focus();

            };


        recognition.onerror =
            event => {

                console.error(
                    "Voice recognition:",
                    event
                );


                showToast(

                    event.error === "not-allowed"
                        ? "Microphone permission denied."
                        : "Voice input failed."

                );

            };


        recognition.onend =
            () => {

                activeRecognition =
                    null;

            };


        try {

            recognition.start();

        }

        catch {

            activeRecognition =
                null;


            showToast(
                "Unable to start voice input."
            );

        }

    }


    /* =========================================================
       CHAT SEARCH
    ========================================================= */

    function searchChats() {

        const query =
            chatSearch.value
                .trim()
                .toLowerCase();


        document
            .querySelectorAll(
                ".recent-item"
            )
            .forEach(
                item => {

                    item.style.display =
                        !query ||
                        item.textContent
                            .toLowerCase()
                            .includes(query)
                            ? "flex"
                            : "none";

                }
            );

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    chatInput.addEventListener(
        "input",
        autoResizeTextarea
    );


    chatInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================================
       FILE UPLOAD
    ========================================================= */

    fileButton.addEventListener(
        "click",
        () => {

            resetFileInput();

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        () => {

            const file =
                fileInput.files?.[0];


            if (!file) {
                return;
            }


            if (
                file.size >
                10 * 1024 * 1024
            ) {

                showToast(
                    "Maximum image size is 10 MB."
                );

                resetFileInput();

                return;

            }


            if (
                !file.type ||
                !file.type.startsWith("image/")
            ) {

                showToast(
                    "Please select an image."
                );

                resetFileInput();

                return;

            }


            showAttachment(file);

        }
    );


    removeAttachment.addEventListener(
        "click",
        () => {

            clearAttachment();

            resetFileInput();

        }
    );


    /* =========================================================
       CAMERA
    ========================================================= */

    cameraButton.addEventListener(
        "click",
        () => {

            fileInput.value =
                "";

            fileInput.setAttribute(
                "accept",
                "image/*"
            );

            fileInput.setAttribute(
                "capture",
                "environment"
            );

            fileInput.click();

        }
    );


    /* =========================================================
       VOICE
    ========================================================= */

    voiceButton.addEventListener(
        "click",
        startVoiceInput
    );


    /* =========================================================
       CHAT CONTROLS
    ========================================================= */

    newChatButton.addEventListener(
        "click",
        startNewChat
    );


    sidebarNewChat.addEventListener(
        "click",
        startNewChat
    );


    clearHistoryButton.addEventListener(
        "click",
        clearHistory
    );


    saveChatButton.addEventListener(
        "click",
        saveCurrentChat
    );


    exportChatButton.addEventListener(
        "click",
        copyConversation
    );


    themeButton.addEventListener(
        "click",
        toggleTheme
    );


    chatSearch.addEventListener(
        "input",
        searchChats
    );


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    mobileMenu.addEventListener(
        "click",
        () => {

            sidebar.classList.toggle(
                "open"
            );

        }
    );


    /* =========================================================
       CLOSE SIDEBAR
    ========================================================= */

    chatMessages.addEventListener(
        "click",
        () => {

            sidebar.classList.remove(
                "open"
            );

        }
    );


    /* =========================================================
       READY
    ========================================================= */

    console.log(
        "CivicAI Life Helper initialized."
    );

    console.log(
        "Normal chat endpoint:",
        CHAT_API_ENDPOINT
    );

    console.log(
        "Image analysis endpoint:",
        ANALYZE_API_ENDPOINT
    );

});
</script>


</body>
</html>
